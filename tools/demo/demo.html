<!doctype html><html lang="id"><head><meta charset="utf-8"><title>Demo Spill Data</title>
<style>
 body{margin:0;font-family:Roboto,Arial,sans-serif;background:#f5f5f5;color:#222}
 .top{background:linear-gradient(#f53d2d,#f63);height:56px;display:flex;align-items:center;padding:0 40px;gap:24px;color:#fff;font-weight:700}
 .top i{flex:1;max-width:620px;background:#fff;height:34px;border-radius:3px;display:block}
 .wrap{max-width:1180px;margin:0 auto;padding:18px 20px}
 .shop{background:#fff;padding:20px;display:flex;gap:20px;align-items:center;border-radius:3px;box-shadow:0 1px 1px rgba(0,0,0,.05)}
 .av{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#ffd9cf,#ffb199)}
 .shop h1{margin:0 0 4px;font-size:20px}.shop small{color:#777}
 .nav{background:#fff;margin-top:10px;display:flex;gap:30px;padding:14px 20px;font-size:15px;color:#555;border-radius:3px}
 .nav b{color:#ee4d2d;border-bottom:2px solid #ee4d2d;padding-bottom:12px}
 .prods{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}
 .p{background:#fff;border-radius:3px;overflow:hidden;font-size:13px}.p div.im{height:150px}.p div.t{padding:8px}.p .pr{color:#ee4d2d;margin-top:6px}
 .sh{height:120px}
</style></head><body>
<div class="top">Marketplace <i></i></div>
<div class="wrap" id="wrap">
 <div class="shop"><div class="av"></div><div><h1>Toko Contoh Fashion</h1><small>Aktif 5 menit lalu · Yogyakarta</small></div></div>
 <div class="nav"><span>Halaman Utama</span><b>Produk</b><span>Kategori</span></div>
 <div id="slot"></div>
 <div class="prods" id="prods"></div>
</div>
<script src="../../src/inline.js"></script>
<script src="data.js"></script>
</body></html>
